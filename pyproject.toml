[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freetoken-intel"
dynamic = ["version"]
description = "Edge-native MoE serving on Intel Arc Pro B70 (SYCL / XPU) with OpenAI- and Anthropic-compatible APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Performant Labs" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "einops>=0.8,<1",
    "fastapi>=0.115,<1",
    "gguf>=0.19,<1",
    "huggingface_hub>=0.26,<3",
    "msgpack>=1.1,<2",
    "numpy>=2.0,<2.5",
    "openai>=1.0,<3",
    "partial-json-parser>=0.2,<1",
    "prompt_toolkit>=3.0,<4",
    "pydantic>=2.9,<3",
    "pyzmq>=26,<28",
    "safetensors>=0.4,<1",
    "tqdm>=4.66,<5",
    "transformers>=4.45,<6",
    "uvicorn>=0.30,<1",
    "torch",
]

[project.urls]
Homepage = "https://github.com/Performant-Labs/FreeToken-Intel"
Repository = "https://github.com/Performant-Labs/FreeToken-Intel"
Issues = "https://github.com/Performant-Labs/FreeToken-Intel/issues"
Upstream = "https://github.com/FlashML-org/FreeToken"

[project.scripts]
ft = "freetoken.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# PyTorch XPU wheels + oneAPI runtime are machine-local; install from the Intel/PyTorch
# XPU index as documented in docs/install.md. intel-extension-for-pytorch is optional.
xpu = []
accel = ["freetoken-intel[xpu]"]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "python"}

[tool.setuptools.dynamic]
version = {attr = "freetoken.version.__version__"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"*" = ["csrc/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: long kernel sweeps or real-checkpoint reads; deselect with -m 'not slow'",
    "xpu: needs an Intel GPU (Arc Pro B70 / Xe2) and oneAPI / Level Zero",
    "needs_weights: needs a real local checkpoint (FREETOKEN_TEST_MODEL)",
]
