[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freetoken-intel"
dynamic = ["version"]
description = "Edge-native MoE serving on Intel Arc Pro B70 (SYCL / XPU) with OpenAI- and Anthropic-compatible APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Performant Labs" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "einops>=0.8,<1",
    "fastapi>=0.115,<1",
    "gguf>=0.19,<1",
    "huggingface_hub>=0.26,<3",
    "msgpack>=1.1,<2",
    "numpy>=2.0,<2.5",
    "openai>=1.0,<3",
    "partial-json-parser>=0.2,<1",
    "prompt_toolkit>=3.0,<4",
    "pydantic>=2.9,<3",
    "pyzmq>=26,<28",
    "safetensors>=0.4,<1",
    "tqdm>=4.66,<5",
    "transformers>=4.45,<6",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/Performant-Labs/FreeToken-Intel"
Repository = "https://github.com/Performant-Labs/FreeToken-Intel"
Issues = "https://github.com/Performant-Labs/FreeToken-Intel/issues"
Upstream = "https://github.com/FlashML-org/FreeToken"

[project.scripts]
ft = "freetoken.cli:main"

[project.optional-dependencies]
 dev = ["pytest>=8.0"]
# The XPU runtime stack. These are the exact pins the verified Jupiter box runs
# (oneAPI 2026.1.1, torch 2.13.0+xpu) and the ones `xpu.yml`'s venv-contract step
# installs -- single source of truth. They resolve ONLY from the PyTorch XPU index
# (`--index-url https://download.pytorch.org/whl/xpu`), so installing this extra
# requires that index URL (see docs/install.md).
#
# torch is installed with --no-deps by the build script / install docs: the XPU
# wheel's metadata pulls nvidia-* CUDA packages on a plain `pip install torch`,
# which must never land on a B70 box. The explicit Intel-side packages below are
# its real runtime deps. intel-extension-for-pytorch is NOT pulled here -- it is
# optional and not required by any current kernel.
xpu = [
    "torch==2.13.0",
    "oneccl==2022.0.0",
    "oneccl-devel==2022.0.0",
    "tbb==2023.0.0",
    "umf==1.1.0",
    "pyzes==0.1.1",
    "tcmlib==1.5.0",
    "triton-xpu==3.7.2",
    "sympy>=1.13.3",
    "onemkl-license==2026.0.0",
    "onemkl-sycl-blas==2026.0.0",
    "onemkl-sycl-dft==2026.0.0",
    "onemkl-sycl-lapack==2026.0.0",
    "onemkl-sycl-rng==2026.0.0",
    "onemkl-sycl-sparse==2026.0.0",
    "jinja2",
    "networkx",
    "intel-cmplr-lib-rt==2026.0.0",
    "intel-cmplr-lib-ur==2026.0.0",
    "intel-cmplr-lic-rt==2026.0.0",
    "intel-sycl-rt==2026.0.0",
    "intel-opencl-rt==2026.0.0",
    "intel-openmp==2026.0.0",
    "dpcpp-cpp-rt==2026.0.0",
    "intel-pti==0.17.0",
]
accel = ["freetoken-intel[xpu]"]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "python"}

[tool.setuptools.dynamic]
version = {attr = "freetoken.version.__version__"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"*" = ["csrc/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: long kernel sweeps or real-checkpoint reads; deselect with -m 'not slow'",
    "xpu: needs an Intel GPU (Arc Pro B70 / Xe2) and oneAPI / Level Zero",
    "needs_weights: needs a real local checkpoint (FREETOKEN_TEST_MODEL)",
]
