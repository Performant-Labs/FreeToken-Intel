# TEMPORARY (ci/trusted-runners): evaluates the trusted-runner rule with
# simulated logins and repos, so the untrusted path is proven without an
# untrusted author. Removed before merge.
name: Runner probe (temporary)

on:
  pull_request:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate the rule
        env:
          ACTUAL: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.TRUSTED_CI_AUTHORS || '[]'), github.event.pull_request.user.login))) && 'SELF' || 'HOSTED' }}
          UNTRUSTED_SAME_REPO: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.TRUSTED_CI_AUTHORS || '[]'), 'some-untrusted-user'))) && 'SELF' || 'HOSTED' }}
          TRUSTED_FORK: ${{ (github.event_name != 'pull_request' || ('someone/fork' == github.repository && contains(fromJSON(vars.TRUSTED_CI_AUTHORS || '[]'), github.event.pull_request.user.login))) && 'SELF' || 'HOSTED' }}
          VAR_UNSET: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.TRUSTED_CI_AUTHORS_UNSET_PROBE || '[]'), github.event.pull_request.user.login))) && 'SELF' || 'HOSTED' }}
          SUBSTRING_LOGIN: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON(vars.TRUSTED_CI_AUTHORS || '[]'), 'aangel'))) && 'SELF' || 'HOSTED' }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TRUSTED: ${{ vars.TRUSTED_CI_AUTHORS }}
        run: |
          printf 'author=%s head_repo=%s TRUSTED_CI_AUTHORS=%s\n' "$AUTHOR" "$HEAD_REPO" "$TRUSTED"
          printf 'actual=%s untrusted_same_repo=%s trusted_fork=%s var_unset=%s substring_login=%s\n' "$ACTUAL" "$UNTRUSTED_SAME_REPO" "$TRUSTED_FORK" "$VAR_UNSET" "$SUBSTRING_LOGIN"
          [ "$ACTUAL" = SELF ] && [ "$UNTRUSTED_SAME_REPO" = HOSTED ] && [ "$TRUSTED_FORK" = HOSTED ] && [ "$VAR_UNSET" = HOSTED ] && [ "$SUBSTRING_LOGIN" = HOSTED ]
