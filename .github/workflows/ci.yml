name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run without a new commit (e.g. re-run a flaky pre-flight, or the
  # red-team validation of a gate on a fixed tree). The pre-flight job reads
  # the workflow files out of the checked-out tree, so a dispatch exercises the
  # exact same path as a push/PR.
  workflow_dispatch:

# Cancel a stale in-flight run when a newer commit lands on the same ref, so a
# force-push or a rapid follow-up push doesn't leave two full runs racing to
# completion. `github.repository` is included (not just `github.workflow`) so
# the group is unique per (repo, ref) and can't collide with another repo that
# shares this workflow name. Parity with the playbook's ci-reusable.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-flight:
    name: Pre-flight (actionlint)
    # Repo is public: this gate runs on GitHub-hosted, NEVER on the self-hosted
    # fleet. A fork PR must never execute on owned hardware, and the org
    # CI_RUNNER variable is a private-org mechanism that does not apply to a
    # public repo. (The test job below is the exception that opts onto the
    # fleet for the baked torch -- it only ever runs on our own runners, never
    # for untrusted fork content, so that's safe.)
    #
    # actionlint is a HARD FAIL: a workflow file that fails lint is the same
    # failure class as the playbook's "drift announces itself" rule. The job
    # has NO `needs:` and is the first job, so a broken workflow file fails
    # fast and cheap before any install/compile/test step runs.
    # Every `uses:` in this workflow is pinned to a full commit SHA (not a
    # floating tag) with a trailing `# vN` comment naming the release the SHA
    # is. Rule: bump pins DELIBERATELY, one PR per action, never implicitly --
    # an unpinned tag is the same failure class as the playbook's retired
    # `CI_RUNNER || 'ubuntu-latest'` bug: a silent, invisible behavior change
    # (a new action release could change checkout or upload semantics under a
    # green-looking run). docs/ci.md states this rule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint workflow files (actionlint, pinned)
        run: |
          # Pin BOTH the download script (v1.7.12 tag, not a floating `main`)
          # and the tool version it fetches (1.7.12) so the gate is
          # reproducible and never silently picks up a newer actionlint with a
          # different rule set. The script's own default is 1.7.12, but we pass
          # it explicitly -- the pin must live in the workflow file, not be
          # inherited from the upstream script's `version="..."` default, which
          # someone upstream could bump.
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint .github/workflows/*.yml

  secret-scan:
    name: Secret scan (gitleaks)
    # Ported VERBATIM from the playbook's secret-scan job in ci-reusable.yml --
    # the comments in each step are load-bearing and travel with the code.
    #
    # TWO deliberate differences from the playbook:
    #
    #   1. runs-on is ubuntu-latest (here), not the org CI_RUNNER variable
    #      (playbook). Same reason as pre-flight above: this repo is public, so
    #      a fork PR must never execute on the self-hosted fleet, and the org
    #      variable is a private-org mechanism. (The test job is the one
    #      exception that opts onto the fleet -- see its comment.)
    #
    #   2. HARD-FAIL on findings, from day 1. The playbook runs warn-only
    #      because 21 repos have untriaged historical baselines. THIS repo has
    #      zero historical commits containing secrets and is public, so a
    #      warn-only period would be a standard nobody reads -- the exact
    #      failure mode the playbook's own doc warns about. So: gitleaks exit
    #      code 2 (leaks found) uploads the redacted JSON report AND fails the
    #      step, instead of the playbook's ::warning::. Any other non-zero exit
    #      is a scanner/infra failure and also fails.
    #
    # The op.env sub-check the playbook appends to this job is DROPPED -- this
    # repo has no op.env.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # pull_request's default ref is the synthetic merge commit -- fetch
          # the real head ref too so "Determine scan range" can use the PR's
          # actual head SHA (github.sha here is the merge commit, NOT the PR
          # head, a common GitHub Actions gotcha). The playbook documents this
          # as empirically proven across every PR shape its fleet has.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # This job never pushes or authenticates as anything -- no reason
          # for git to hold a credential in its local config afterward,
          # especially one running over untrusted PR content.
          persist-credentials: false

      # Downloaded into $RUNNER_TEMP and left there (not /usr/local/bin) --
      # self-hosted runners are long-lived and shared across jobs; a global
      # `sudo mv` mutates every future job on that machine, not just this
      # one. $GITHUB_PATH makes the temp copy resolve as `gitleaks` for the
      # rest of THIS job only. --fail (a 4xx/5xx response is a real error,
      # not a 200 body containing an HTML error page) + --retry for
      # transient network blips. gitleaks is pinned to 8.30.1 (the org
      # developer-setup baseline) and sha256-verified against the release's
      # own checksums.txt -- the pin lives in this file, not a floating tag.
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL --fail --retry 3 --retry-all-errors -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSL --fail --retry 3 --retry-all-errors -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep " gitleaks_8.30.1_linux_x64.tar.gz\$" gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xz gitleaks -f gitleaks_8.30.1_linux_x64.tar.gz
          chmod +x gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # HEAD is the PR's real head SHA, not `github.sha` (see the checkout
      # step above). BASE resolves per event, used ONLY if it's actually
      # resolvable in this checkout.
      #
      # An unreachable base (a force-push whose old tip no longer exists, or a
      # genuinely new ref) degrades to the best range this job CAN compute --
      # first the push payload's own commit list, then the tip commit alone
      # (`HEAD^!`, never a bare `HEAD`, which would walk full history) -- with
      # a visible ::warning::. It never silently under-scans and never fails
      # the step: a routine rebase is common, not an edge case, and failing CI
      # over an ordinary git operation would be noise. (The playbook's
      # warn-only framing of this is adapted below: the coverage-gap warning
      # text is kept, since it's accurate regardless of the fail policy.)
      #
      # Deletion pushes and tag pushes are skipped entirely: a deletion has no
      # tree to scan, and a tag doesn't introduce new commits -- whatever it
      # points at was already scanned when THOSE commits were pushed as branch
      # commits.
      #
      # Only `pull_request` and `push` are handled -- any other trigger
      # (`workflow_dispatch`, `schedule`, `merge_group`, ...) FAILS rather than
      # silently reusing push-shaped logic for an event this job was never
      # designed to compute a range for.
      - name: Determine scan range
        id: range
        run: |
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "${{ github.event_name }}" = "push" ] && \
             { [ "${{ github.event.deleted }}" = "true" ] || \
               [ "${{ startsWith(github.event.ref, 'refs/tags/') }}" = "true" ]; }; then
            echo "range=" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::secret-scan: deletion or tag push -- nothing new to scan, skipping."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          else
            echo "::error::secret-scan: unsupported trigger event '${{ github.event_name }}' -- this job only knows how to compute a range for pull_request and push. Failing rather than guessing a range for an event shape it wasn't designed for."
            exit 1
          fi

          resolves() { git cat-file -e "${1}^{commit}" 2>/dev/null; }

          if [ -n "$BASE" ] && [ "$BASE" != "$ZERO_SHA" ] && resolves "$BASE"; then
            RANGE="${BASE}..${HEAD}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            FIRST="${{ github.event.commits[0].id }}"
            if [ -n "$FIRST" ] && resolves "$FIRST" && git rev-parse -q --verify "${FIRST}^" >/dev/null 2>&1; then
              RANGE="${FIRST}^..${HEAD}"
              echo "::notice::secret-scan: base unavailable -- recovered a range from the push payload's own commit list ($RANGE)."
            else
              RANGE="${HEAD}^!"
              echo "::warning::secret-scan: could not compute a complete scan range (new ref with no resolvable parent, or the push payload's commit list is empty/truncated) -- scanning only the tip commit $HEAD."
            fi
          else
            RANGE="${HEAD}^!"
            echo "::warning::secret-scan: PR base commit unavailable in this checkout -- scanning only the tip commit $HEAD."
          fi
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # --exit-code 2 for findings (default is 1): gitleaks' OWN docs say
      # exit 1 means "leaks are found OR an error occurred during scanning" --
      # the two are NOT distinguishable by exit code alone at the default.
      # Requesting a distinct code for findings makes the 0/2/anything-else
      # branching below actually sound: 1 now unambiguously means a real
      # scanner error.
      #
      # DELIBERATE DIFF FROM THE PLAYBOOK (see the job comment): exit 2
      # (leaks found) sets leaks=true AND FAILS THE STEP. The playbook emits a
      # ::warning:: and lets the run stay green during its baseline period;
      # this repo has zero historical secret commits and is public, so a
      # finding is a finding and the gate must be red. The redacted JSON report
      # is uploaded in the next step either way.
      - name: gitleaks (secrets introduced by this push/PR)
        id: gitleaks
        if: steps.range.outputs.skip != 'true'
        run: |
          set +e
          gitleaks git --log-opts="${{ steps.range.outputs.range }}" \
            --redact --no-banner --exit-code 2 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "leaks=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "leaks=true" >> "$GITHUB_OUTPUT"
            echo "::error::secret-scan: gitleaks found leaks in this push/PR's commit range -- see the uploaded redacted report. This is a HARD FAIL (unlike the playbook's warn-only baseline): this repo has no untriaged historical secrets, so a finding blocks the PR."
            exit 2
          else
            echo "::error::secret-scan: gitleaks exited $code (not 0=clean or 2=leaks-found) -- this indicates a scanner or config problem, not a benign finding. Failing the step rather than treating an infra failure as a pass."
            exit "$code"
          fi

      # continue-on-error here is legitimate (unlike the gitleaks step above,
      # which deliberately avoids it so a finding FAILS the job): an upload
      # failure (network blip, name collision) must not turn a red
      # hard-fail into a confusing third state. Name includes run ID + attempt
      # so a rerun can't collide with the artifact from the prior attempt.
      # Report written to $RUNNER_TEMP (not the checked-out workspace) so it
      # never lands in the tree gitleaks itself scans.
      - name: Upload gitleaks report
        if: always() && steps.gitleaks.outputs.leaks == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitleaks-report.json
          retention-days: 14

  ci:
    name: Typecheck, test, and CLI smoke (CPU)
    # The main per-PR job. Runs on GitHub-hosted ubuntu-latest -- NOT the
    # self-hosted fleet. Two reasons:
    #
    #   1. Fork safety. This repo is public, so a fork PR's code runs in this
    #      job. It must never execute on owned hardware, and the org CI_RUNNER
    #      variable is a private-org mechanism that does not apply here.
    #      (pre-flight and secret-scan above are on the same footing.)
    #
    #      Because ALL jobs in this workflow are on ubuntu-latest, a fork PR
    #      never reaches owned hardware -- and so this workflow deliberately
    #      carries NO `github.repository == ...` identity guard. Contrast
    #      xpu.yml, whose build job runs on the fleet and therefore guards
    #      every job on repo identity. Adding a guard here would be dead
    #      weight; omitting one where it matters would be a fleet exposure.
    #
    #   2. The dual-venv contract. This job builds the CPU `.venv` -- which by
    #      the project's load-bearing separation must NEVER contain torch.
    #      torch (the XPU build) lives only in the separate `.venv-xpu`. That
    #      contract is enforced by the CUDA-import guard step below, which fails
    #      if `import torch` ever succeeds in this venv.
    #
    # Python 3.11, not the 3.12 the previous revision used: the dev venvs
    # (.venv AND .venv-xpu) are both 3.11, so the CPU CI venv must match the
    # XPU venv's minor to keep wheel tags (cp311) aligned. A CPU venv on a
    # different minor than the XPU venv is a silent divergence trap. (docs/
    # dev-setup.md previously said "CI uses 3.12" -- that line is corrected in
    # the same change.)
    #
    # Because this venv has no torch, the torch-dependent tests
    # (test_engine_loop, test_models_loader, test_moe_offload_*) SKIP here via
    # their module-level `pytest.importorskip("torch")` -- a clean skip, never
    # a collection error. Their real coverage now lives on the XPU nightly
    # (xpu.yml, #50), which runs them on the GPU runner where torch is present.
    # This is the deliberate trade: per-PR CI stays fork-safe and torch-free;
    # the torch path is verified on a trusted, main-only schedule instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      # Typecheck-before-lint ordering (playbook: a lint pass can mask a type
      # error -- flotilla #236). We have no mypy/ruff yet, so the analogs are
      # (a) byte-compile every module, then (b) the full CPU test suite.
      - name: Byte-compile (syntax-class check)
        run: python -m compileall -q python/

      # Full CPU suite. xpu + slow + needs_weights are all excluded: xpu needs
      # a GPU (nightly), slow is a long sweep, needs_weights needs a real
      # checkpoint (FREETOKEN_TEST_MODEL) that CI does not have. The CTRF
      # reporter (pytest-json-ctrf, installed in Install) writes the machine-
      # readable result to ctrf/pytest-ctrf.json for the artifact below.
      - name: Unit tests (CPU)
        run: |
          python -m pip install -q pytest-json-ctrf
          pytest -m "not xpu and not slow and not needs_weights" -q \
            --ctrf ctrf/pytest-ctrf.json

      # HARD venv-contract guard. The dual-venv split (.venv = CPU, never
      # torch; .venv-xpu = the only place torch lives) is load-bearing: the
      # whole CUDA->SYCL premise rests on the CPU side never importing a CUDA/
      # CPU torch. Nothing else enforces it, so this step does. If `import
      # torch` SUCCEEDS in the CI venv, someone added torch to [project]
      # dependencies or [dev] -- that is a contract breach and fails the build
      # with an explanatory annotation rather than failing opaquely inside a
      # test.
      - name: "venv contract: torch must NOT be importable"
        run: |
          if python -c "import torch" 2>/dev/null; then
            echo "::error::venv-contract violated: 'import torch' SUCCEEDED in the CPU CI venv. The dual-venv contract (see docs/dev-setup.md) requires torch to live ONLY in .venv-xpu -- the CPU [.dev]/[project] dependency set must never pull in torch (CUDA or CPU). Remove it; if torch is genuinely needed on the CPU side that is a design change to discuss, not a silent dependency."
            exit 1
          fi
          echo "OK: torch is not importable in the CPU venv (contract holds)."

      # CLI smoke. Hardened from the previous `ft device || true`: on a
      # GPU-less runner, `ft device` reporting an XPU as available is exactly
      # the drift this check exists to catch, and `|| true` made it invisible.
      # A runner that somehow has a GPU is a fleet misconfiguration -- let it
      # fail loudly instead of silently passing.
      #
      # The assertion reads the tee'd file with a plain `grep` (NO pipe): the
      # `ft device | tee` pipeline above is kept for human log visibility only.
      # A `pipefail` + `grep -q` on the same pipe is a latent false-negative --
      # grep -q exits 0 the moment it finds the match, but the upstream
      # producer can then die on SIGPIPE, and with pipefail the pipeline's
      # exit status becomes that producer's non-zero, not grep's 0. So the
      # pass/fail decision must come from a separate, pipe-free grep.
      - name: CLI smoke
        run: |
          ft --version
          ft --help
          ft device | tee device.out
          grep -q "xpu available: False" device.out \
            || { echo "::error::ft device did not report 'xpu available: False' on a GPU-less runner -- either the runner unexpectedly has a GPU (fleet misconfiguration) or the device-detection drift this check guards against has regressed."; cat device.out; exit 1; }
          echo "OK: ft device reports 'xpu available: False'."

      # CTRF artifact. The ONLY continue-on-error in this workflow: an artifact
      # upload failure (network blip) must never turn a green or red test run
      # into a confusing third state. if: always() so a failing run still
      # uploads its report (that is when the report is most needed). 30-day
      # retention, playbook parity. There is no PR check-run summary for CTRF
      # (playbook parity) -- reading it today means downloading the artifact.
      - name: Upload CTRF test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctrf-reports
          path: ctrf/
          retention-days: 30
          if-no-files-found: ignore
