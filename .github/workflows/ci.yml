name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests (CPU)
        run: pytest -m "not xpu and not slow" -q
      - name: CLI smoke
        run: |
          ft --version
          ft --help
          ft device || true
